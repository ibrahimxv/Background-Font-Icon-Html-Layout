<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="invitation">
        <div class="main-title">
            <div class="the">The</div>
            <div class="wedding">Wedding</div>
            <div class="of">of</div>
        </div>

        <div class="names">
            LAUREN HALL & JORDON QUINN
        </div>

        <div class="join-text">
            PLEASE JOIN US ON
        </div>

        <div class="date">
            FRIDAY 24TH APRIL 2019
            <br>
            2 O'CLOCK
        </div>
        
        <div class="location">
            WINCHESTER HOUSE
        </div>

        <div class="reception">
            Reception to follow
        </div>
    </div>
</body>
</html>
